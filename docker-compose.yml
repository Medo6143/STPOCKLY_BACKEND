# Local development infrastructure for Stockly (docs/architecture/structure.md §4).
# Usage: cp .env.example .env && docker compose up -d   (add --profile dev for pgAdmin)
# Every credential comes from .env; compose refuses to start when one is missing.

name: stockly

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required. Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required. Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - stockly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Cache only (docs/design/redis.md): no persistence. volatile-lru evicts only keys with a TTL,
  # so the TTL-less version counters (stockly:{shopId}:ver:catalog) are never evicted.
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - stockly
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Community build of MinIO by the Pigsty project, pinned by tag and digest.
  # Local development and tests only (ADR-0008, 2026-10 update).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required. Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - stockly
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the private invoice bucket and the least-privilege API user. Safe to re-run.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required. Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required. Copy .env.example to .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-stockly-invoices}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required. Copy .env.example to .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required. Copy .env.example to .env}
    networks:
      - stockly
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        # Image lifecycle (docs/operations/image-lifecycle.md): invoice images expire 90 days after upload
        # (InvoiceLimits.ImageRetentionDays). Added once: a re-run finds the rule and skips it.
        ilm_rules="$$(mc ilm rule ls --json "local/$$MINIO_BUCKET" 2>/dev/null || true)"
        case "$$ilm_rules" in
          *'"Days":90'*) echo "Lifecycle rule (expire after 90 days) already on $$MINIO_BUCKET" ;;
          *) mc ilm rule add --expire-days 90 "local/$$MINIO_BUCKET" ;;
        esac
        cat > /tmp/stockly-api-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET"]
            }
          ]
        }
        EOF
        mc admin policy create local stockly-api /tmp/stockly-api-policy.json
        mc admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        # The mc image has no grep; match the user info with a shell case instead.
        user_info="$$(mc admin user info local "$$STORAGE_ACCESS_KEY")"
        case "$$user_info" in
          *stockly-api*) echo "Policy stockly-api already attached to $$STORAGE_ACCESS_KEY" ;;
          *) mc admin policy attach local stockly-api --user "$$STORAGE_ACCESS_KEY" ;;
        esac
        echo "minio-init done: bucket $$MINIO_BUCKET is private, API user has policy stockly-api"
    # One-shot job: it exits when done, so a health check has nothing to probe.
    healthcheck:
      disable: true

  pgadmin:
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required. Copy .env.example to .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    networks:
      - stockly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pg_data:
  minio_data:

networks:
  stockly:
